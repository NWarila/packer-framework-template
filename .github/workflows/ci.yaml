name: CI

# Self-validation for packer-framework-template. Exercises the reference
# framework end-to-end without credentials, while keeping the same repo-quality
# surface derivative Packer frameworks should inherit.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run actionlint
        uses: reviewdog/action-actionlint@6fb7acc99f4a1008869fa8a0f09cfca740837d9d # v1.72.0
        with:
          fail_level: error
          reporter: github-check

  workflow-helper-tests:
    name: workflow helper tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install Bats and ShellCheck
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bats shellcheck
      - name: ShellCheck workflow helpers
        run: shellcheck tools/install_ci_tools.sh tools/ci/*.sh
      - name: Check workflow run-block input binding
        run: python tools/ci/check_workflow_run_inputs.py .github/workflows
      - name: Bats workflow helper tests
        run: bats tests/ci/*.bats

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@6b51ade7a9e4a75a7ad929842dd298a3804ebe8b # v23.1.0
        with:
          globs: "**/*.md"

  mypy-advisory:
    name: mypy (advisory)
    # Type-check `tools/` to surface real regressions in static typing.
    # Advisory only — does not block merges. Use `::warning::` annotations
    # so findings are visible in PR review without failing the job.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install mypy
        run: pip install --no-cache-dir mypy==1.13.0 types-PyYAML==6.0.12.20240917
      - name: Run mypy (advisory)
        run: |
          python -m mypy --ignore-missing-imports tools/ \
            || echo "::warning::Mypy advisory reported findings (does not block merge)"

  packer-ci:
    name: packer verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install pinned CI tools
        env:
          # renovate: datasource=github-releases depName=rhysd/actionlint
          ACTIONLINT_VERSION: "1.7.12"
          # renovate: datasource=npm depName=markdownlint-cli2
          MARKDOWNLINT_CLI2_VERSION: "0.22.1"
          # renovate: datasource=github-releases depName=hashicorp/packer extractVersion=^v(?<version>.*)$
          PACKER_VERSION: "1.15.0"
          # renovate: datasource=github-releases depName=open-policy-agent/opa
          OPA_VERSION: "1.10.0"
        run: bash tools/install_ci_tools.sh

      - name: Install Bats and ShellCheck
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bats shellcheck

      - name: Verify
        run: python tools/verify.py verify

  windows-path-checks:
    name: packer verify / windows path checks
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install Packer and OPA
        shell: pwsh
        env:
          # renovate: datasource=github-releases depName=hashicorp/packer extractVersion=^v(?<version>.*)$
          PACKER_VERSION: "1.15.0"
          # renovate: datasource=github-releases depName=open-policy-agent/opa
          OPA_VERSION: "1.10.0"
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "packer.zip"
          $checksums = Join-Path $env:RUNNER_TEMP "packer_SHA256SUMS"
          $dest = Join-Path $env:RUNNER_TEMP "packer"
          $fileName = "packer_$($env:PACKER_VERSION)_windows_amd64.zip"
          Invoke-WebRequest `
            -Uri "https://releases.hashicorp.com/packer/$env:PACKER_VERSION/$fileName" `
            -OutFile $zip
          Invoke-WebRequest `
            -Uri "https://releases.hashicorp.com/packer/$env:PACKER_VERSION/packer_$($env:PACKER_VERSION)_SHA256SUMS" `
            -OutFile $checksums
          $line = Get-Content $checksums | Where-Object {
            $_ -match "\s+$([regex]::Escape($fileName))$"
          } | Select-Object -First 1
          if (-not $line) {
            throw "Checksum entry for $fileName was not found"
          }
          $expected = (($line -split "\s+")[0]).ToLowerInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "SHA256 mismatch for $fileName. Expected $expected, got $actual"
          }
          Expand-Archive -Path $zip -DestinationPath $dest -Force

          $opa = Join-Path $dest "opa.exe"
          $opaChecksum = Join-Path $env:RUNNER_TEMP "opa_windows_amd64.exe.sha256"
          Invoke-WebRequest `
            -Uri "https://github.com/open-policy-agent/opa/releases/download/v$env:OPA_VERSION/opa_windows_amd64.exe" `
            -OutFile $opa
          Invoke-WebRequest `
            -Uri "https://github.com/open-policy-agent/opa/releases/download/v$env:OPA_VERSION/opa_windows_amd64.exe.sha256" `
            -OutFile $opaChecksum
          $expectedOpa = ((Get-Content $opaChecksum | Select-Object -First 1) -split "\s+")[0].ToLowerInvariant()
          $actualOpa = (Get-FileHash -Algorithm SHA256 $opa).Hash.ToLowerInvariant()
          if ($actualOpa -ne $expectedOpa) {
            throw "SHA256 mismatch for OPA. Expected $expectedOpa, got $actualOpa"
          }

          Add-Content -Path $env:GITHUB_PATH -Value $dest
          & (Join-Path $dest "packer.exe") version
          & $opa version

      - name: Verify path-sensitive cases
        shell: pwsh
        run: |
          python tools/verify.py init
          python tools/verify.py plugin-install-check
          python tools/verify.py packer-validate-safe --case reference-windows
          python tools/verify.py test
